name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  WORKING_DIRECTORY: './frontend'
  EXPO_PUBLIC_BACKEND_URL: 'https://bookscrubby.com'
  EXPO_PUBLIC_IMAGES_URL: 'https://bookscrubby.com'

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/yarn.lock

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Check Expo configuration
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npx expo-doctor

      - name: Run ESLint
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn lint
        continue-on-error: true

      - name: Export web application
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn build

      - name: Upload web export
        uses: actions/upload-artifact@v4
        with:
          name: book-scrubby-web
          path: ${{ env.WORKING_DIRECTORY }}/build
          retention-days: 7
