    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile

      - name: Require Expo access token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN2 }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN2 is required to access Expo-managed signing credentials."
            exit 1
          fi

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN2 }}

      - name: Prepare artifact directory
        run: mkdir -p build

      - name: Build development IPA
        if: ${{ inputs.buildType == 'development' || inputs.buildType == 'all' }}
