name: Local EAS Builds

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/react-native-cicd.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/react-native-cicd.yml"
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Platform to build
        required: true
        default: android
        options:
          - android
          - ios
          - all
      buildType:
        type: choice
        description: Artifact type to build
        required: true
        default: development
        options:
          - development
          - android-apk
          - android-aab
          - ios-production
          - publish-expo
          - publish-stores
          - all

permissions:
  contents: read

concurrency:
  group: local-eas-${{ github.ref }}-${{ github.event.inputs.platform }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  validate-request:
    name: Validate build selection
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - name: Validate inputs and select runners
        id: selection
        shell: bash
        env:
          PLATFORM: ${{ github.event.inputs.platform || 'android' }}
          BUILD_TYPE: ${{ github.event.inputs.buildType || 'development' }}
        run: |
          case "$PLATFORM:$BUILD_TYPE" in
            android:development|android:android-apk|android:android-aab|android:publish-stores|android:all)
              ;;
            ios:development|ios:ios-production|ios:publish-stores|ios:all)
              ;;
            all:development|all:publish-expo|all:publish-stores|all:all)
              ;;
            *)
              echo "::error::$BUILD_TYPE is not valid for platform $PLATFORM."
              exit 1
              ;;
          esac

          case "$PLATFORM" in
            android)
              matrix='{"include":[{"platform":"android","runner":"ubuntu-latest"}]}'
              ;;
            ios)
              matrix='{"include":[{"platform":"ios","runner":"macos-latest"}]}'
              ;;
            all)
              matrix='{"include":[{"platform":"android","runner":"ubuntu-latest"},{"platform":"ios","runner":"macos-latest"}]}'
              ;;
          esac

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"


  build:
    name: Build ${{ matrix.platform }} locally
    needs: validate-request
    strategy:
      matrix: ${{ fromJSON(needs.validate-request.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Set up JDK 17
        if: ${{ matrix.platform == 'android' }}
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile

      - name: Require Expo access token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN2 }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN2 is required to access Expo-managed signing credentials."
            exit 1
          fi

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN2 }}

      - name: Prepare artifact directory
        run: mkdir -p build

      - name: Build development APK
        if: ${{ matrix.platform == 'android' && (github.event_name == 'push' || github.event.inputs.buildType == 'development' || github.event.inputs.buildType == 'all') }}
        run: eas build --platform android --profile development --local --non-interactive --output ./build/book-scrubby-dev.apk

      - name: Build production APK
        if: ${{ matrix.platform == 'android' && (github.event.inputs.buildType == 'android-apk' || github.event.inputs.buildType == 'all') }}
        run: eas build --platform android --profile production-apk --local --non-interactive --output ./build/book-scrubby-prod.apk

      - name: Build production AAB
        if: ${{ matrix.platform == 'android' && (github.event.inputs.buildType == 'android-aab' || github.event.inputs.buildType == 'all') }}
        run: eas build --platform android --profile production --local --non-interactive --output ./build/book-scrubby-prod.aab

      # ─── iOS Builds ────────────────────────────────────────────────────────

      - name: Build development IPA
        if: ${{ matrix.platform == 'ios' && (github.event.inputs.buildType == 'development' || github.event.inputs.buildType == 'all') }}
        run: eas build --platform ios --profile development --local --non-interactive --output ./build/book-scrubby-dev.ipa

      - name: Build production IPA
        if: ${{ matrix.platform == 'ios' && (github.event.inputs.buildType == 'ios-production' || github.event.inputs.buildType == 'all') }}
        run: eas build --platform ios --profile production --local --non-interactive --output ./build/book-scrubby-prod.ipa

      # ─── Store Submissions ─────────────────────────────────────────────────

      - name: 🚀 Publish OTA update (Expo)
        if: |
          github.event.inputs.buildType == 'publish-expo' ||
          github.event.inputs.buildType == 'all'
        run: eas update --auto --non-interactive

      - name: 🚀 Submit to Google Play Store (Android)
        if: |
          matrix.platform == 'android' &&
          (github.event.inputs.buildType == 'publish-stores' ||
           github.event.inputs.buildType == 'all')
        run: eas submit --platform android --path ./build/book-scrubby-prod.aab --non-interactive

      - name: 🚀 Submit to Apple App Store (iOS)
        if: |
          matrix.platform == 'ios' &&
          (github.event.inputs.buildType == 'publish-stores' ||
           github.event.inputs.buildType == 'all')
        env:
          EXPO_ASC_API_KEY_PATH: ./AuthKey_676XW385F6.p8
          EXPO_ASC_KEY_ID: 676XW385F6
          EXPO_ASC_ISSUER_ID: 207e2f58-9fab-4c4a-a87c-d292a1c2aaaa
        run: eas submit --platform ios --path ./build/book-scrubby-prod.ipa --non-interactive

      # ─── Google Drive Upload (rclone) ──────────────────────────────────────

      - name: 🏗 Setup rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          version: latest
        continue-on-error: true

      - name: 🔌 Test Google Drive connection
        continue-on-error: true
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: ${{ secrets.RCLONE_CONFIG_GDRIVE_TYPE }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: "12oQKDzcP_wWVFG51LgUOL9_AojFct9cP"
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [gdrive]
          type = ${RCLONE_CONFIG_GDRIVE_TYPE}
          token = ${RCLONE_CONFIG_GDRIVE_TOKEN}
          root_folder_id = ${RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID}
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

          echo "Book Scrubby CI connected ✅ run=${{ github.run_id }} platform=${{ matrix.platform }} time=$(date -u)" > /tmp/ci-ping.txt
          rclone copy /tmp/ci-ping.txt "gdrive:Book Scrubby Builds" -v
          echo "✅ Test file uploaded to Google Drive"

      - name: 📤 Upload builds to Google Drive
        continue-on-error: true
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: ${{ secrets.RCLONE_CONFIG_GDRIVE_TYPE }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
          # Folder: https://drive.google.com/drive/folders/12oQKDzcP_wWVFG51LgUOL9_AojFct9cP
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: "12oQKDzcP_wWVFG51LgUOL9_AojFct9cP"
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [gdrive]
          type = ${RCLONE_CONFIG_GDRIVE_TYPE}
          token = ${RCLONE_CONFIG_GDRIVE_TOKEN}
          root_folder_id = ${RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID}
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

          VERSION=$(node -p "require('./app.json').expo.version")
          FOLDER="Book Scrubby Builds/${VERSION}-${{ github.event.inputs.buildType }}-${{ github.run_id }}-${{ matrix.platform }}"

          rclone mkdir "gdrive:${FOLDER}"
          rclone copy ./build "gdrive:${FOLDER}" \
            --include "*.apk" --include "*.aab" --include "*.ipa" -v
          echo "✅ Uploaded to Google Drive: ${FOLDER}"

      # ─── Artifacts ─────────────────────────────────────────────────────────

      - name: 📦 Upload build artifacts to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-scrubby-${{ matrix.platform }}-${{ github.event.inputs.buildType }}-${{ github.run_id }}
          path: |
            frontend/build/*.apk
            frontend/build/*.aab
            frontend/build/*.ipa
          if-no-files-found: warn
          retention-days: 7

