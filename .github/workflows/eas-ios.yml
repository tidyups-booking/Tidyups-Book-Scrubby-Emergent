name: EAS iOS Build and Submit

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/eas-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build and submit iOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Create App Store Connect key
        working-directory: frontend
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_API_KEY_P8_BASE64" ]; then
            echo "ASC_API_KEY_P8_BASE64 repository secret is required."
            exit 1
          fi
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > AuthKey_676XW385F6.p8
          chmod 600 AuthKey_676XW385F6.p8

      - name: Build and submit iOS app
        working-directory: frontend
        run: eas build --platform ios --profile production --auto-submit --non-interactive --wait
